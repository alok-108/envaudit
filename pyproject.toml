[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "envaudit"
version = "0.1.0"
description = "Zero-dependency CLI that audits .env, .env.example, and your codebase for missing, unused, or leaked environment variables."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "envaudit contributors" }
]
keywords = ["dotenv", "env", "security", "cli", "linter", "devops", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

[project.scripts]
envaudit = "envaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
